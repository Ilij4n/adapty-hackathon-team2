<title>Case Desk Design Iterations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;650&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a contact sheet on a light table. Quiet neutral ground so the four directions carry the colour;
   one grease-pencil red marks the pick, the way a reviewer circles a frame. */
:root {
  --table: #e9eae6;
  --sheet: #f7f7f4;
  --ink: #1c1d1f;
  --ink-2: #4f5257;
  --ink-3: #6a6d72;
  --line: #d2d3ce;
  --pencil: #b9321c;
  --code-bg: #e1e2dd;
  --shadow: 0 1px 1px rgba(28, 29, 31, .06), 0 6px 18px rgba(28, 29, 31, .08);
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #161719; --sheet: #1f2023; --ink: #ecece8; --ink-2: #b0b2b6; --ink-3: #8d9095; --line: #34363a;
    --pencil: #ff8a6e; --code-bg: #2a2c30; --shadow: 0 1px 1px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #161719; --sheet: #1f2023; --ink: #ecece8; --ink-2: #b0b2b6; --ink-3: #8d9095; --line: #34363a;
  --pencil: #ff8a6e; --code-bg: #2a2c30; --shadow: 0 1px 1px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--table); color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); padding-block: 48px 96px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 650; letter-spacing: -0.015em; }
p { margin: 0; text-wrap: pretty; }
code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: .1em .4em; border-radius: 4px; overflow-wrap: anywhere; }
a { color: inherit; text-underline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; border-radius: 4px; }

/* intro */
.intro { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr); margin-bottom: 72px; }
@media (min-width: 960px) { .intro { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; } }
.intro h1 { font-size: clamp(2rem, 4.2vw, 3.1rem); line-height: 1.05; max-width: 16ch; }
.intro .lead { margin-top: 18px; font-size: 1.12rem; color: var(--ink-2); max-width: 58ch; }
.intro .lead + .lead { margin-top: 12px; }
.run { background: var(--sheet); border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow); display: grid; gap: 12px; font-size: .94rem; min-width: 0; }
.run h2 { font-size: 1rem; }
.run pre { margin: 0; font-family: var(--mono); font-size: .8rem; line-height: 1.6; background: var(--code-bg); border-radius: 6px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
.run p { color: var(--ink-2); }
nav ol { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; }
nav a { text-decoration: none; font-weight: 500; color: var(--ink-2); }
nav a:hover { color: var(--ink); text-decoration: underline; }
nav .nv { font-family: var(--mono); font-size: .8rem; color: var(--ink-3); margin-right: 4px; }

/* comparison */
.compare { margin-bottom: 80px; }
.compare h2 { font-size: 1.35rem; margin-bottom: 16px; }
.table-wrap { overflow-x: auto; background: var(--sheet); border-radius: 10px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 12px 16px; border-bottom: 1px solid var(--line); }
thead th { font-weight: 650; font-size: .95rem; }
tbody th { font-weight: 500; color: var(--ink-3); width: 120px; }
tr:last-child th, tr:last-child td { border-bottom: 0; }

/* one iteration */
.it { padding-top: 56px; border-top: 1px solid var(--line); margin-top: 56px; }
.it-head { display: grid; gap: 8px; margin-bottom: 28px; position: relative; }
.it-url { display: flex; gap: 8px; flex-wrap: wrap; }
.it h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); line-height: 1.1; }
.lede { font-size: 1.1rem; color: var(--ink-2); max-width: 62ch; }
.pick { justify-self: start; color: var(--pencil); font-weight: 650; font-size: .95rem; padding: 2px 12px; border: 2px solid var(--pencil); border-radius: 46% 54% 50% 50% / 60% 45% 55% 40%; transform: rotate(-2deg); }
.it-body { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1080px) { .it-body { grid-template-columns: 330px minmax(0, 1fr); } }
.it-text { display: grid; gap: 14px; align-content: start; color: var(--ink-2); font-size: .98rem; }
.it-text p:first-child { color: var(--ink); }
.facts { margin: 6px 0 0; display: grid; gap: 10px; }
.facts div { display: grid; gap: 1px; }
.facts dt { font-size: .8rem; color: var(--ink-3); }
.facts dd { margin: 0; color: var(--ink); font-size: .92rem; }
.palette { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 12px; }
.palette li { display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; font-size: .8rem; }
.sw { width: 22px; height: 22px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); grid-row: span 2; }
.sw-name { color: var(--ink); }
.palette code { background: none; padding: 0; font-size: .74rem; color: var(--ink-3); }

.it-shots { display: grid; gap: 18px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.desk { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .desk { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.phones { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
figure { margin: 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
figcaption { font-size: .8rem; color: var(--ink-3); }
.zoom { all: unset; cursor: zoom-in; display: block; border-radius: 8px; overflow: hidden; background: var(--sheet); box-shadow: var(--shadow); }
.zoom:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; }
.zoom img { display: block; width: 100%; height: auto; }
.shot.wide .zoom { aspect-ratio: 1440 / 900; }
.shot.wide .zoom img { height: 100%; object-fit: cover; object-position: top; }
.shot.phone .zoom { border-radius: 14px; aspect-ratio: 390 / 844; }
.shot.phone .zoom img { height: 100%; object-fit: cover; object-position: top; }
.more-shots summary { cursor: pointer; font-weight: 500; color: var(--ink-2); }
.more-shots summary:hover { color: var(--ink); }
.more-shots[open] summary { margin-bottom: 16px; }

/* viewer */
dialog { border: 0; padding: 0; background: transparent; max-width: min(1500px, 96vw); max-height: 94vh; }
dialog::backdrop { background: rgba(10, 10, 12, .82); }
dialog figure { gap: 10px; }
dialog img { display: block; max-width: 100%; max-height: 86vh; width: auto; height: auto; margin: 0 auto; border-radius: 8px; }
dialog figcaption { color: #e9e9e6; text-align: center; font-size: .9rem; }
dialog .close { position: fixed; top: 14px; right: 18px; font: inherit; color: #e9e9e6; background: rgba(255,255,255,.12); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
dialog .scroll { max-height: 86vh; overflow: auto; }
footer { margin-top: 96px; color: var(--ink-3); font-size: .86rem; max-width: 70ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <div class="intro">
    <div>
      <h1>{{H1}}</h1>
      <p class="lead">{{LEAD1}}</p>
      <p class="lead">{{LEAD2}}</p>
      <nav aria-label="Iterations"><ol>{{NAV}}</ol></nav>
    </div>
    <aside class="run" aria-labelledby="run-h">
      <h2 id="run-h">Run them</h2>
      <pre>{{RUN}}</pre>
      <p>{{RUNNOTE}}</p>
    </aside>
  </div>

  <section class="compare" aria-labelledby="cmp-h">
    <h2 id="cmp-h">How the four differ</h2>
    <div class="table-wrap">{{TABLE}}</div>
  </section>

  {{SECTIONS}}

  <footer>{{FOOTER}}</footer>
</div>

<dialog id="viewer" aria-label="Screenshot">
  <button class="close" type="button" id="viewerClose">Close</button>
  <figure><div class="scroll"><img id="viewerImg" alt=""></div><figcaption id="viewerCap"></figcaption></figure>
</dialog>
<script>
(() => {
  const dlg = document.getElementById("viewer"), img = document.getElementById("viewerImg"), cap = document.getElementById("viewerCap");
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".zoom");
    if (b) { img.src = b.dataset.src; img.alt = b.dataset.cap; cap.textContent = b.dataset.cap; dlg.showModal(); return; }
    if (e.target === dlg) dlg.close();
  });
  document.getElementById("viewerClose").addEventListener("click", () => dlg.close());
})();
</script>
