<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="836" viewBox="0 0 1280 836" role="img" aria-labelledby="t d">
<title id="t">Case Desk architecture</title>
<desc id="d">The app's Lumen Help widget sends a message with an HMAC-signed user id to the Case Desk server (FastAPI). Claude reads the intent and writes the words; code reads the Adapty profile, classifies one of 13 states, builds the FactSheet and applies the policy table; a validator blocks any fact not in the FactSheet, with a template fallback. Money waits for the developer: rules (ask, auto, never), approvals in the console or over MCP, then an Adapty grant.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1324"/><stop offset="1" stop-color="#080D19"/></linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#8592AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#FFA84C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#3FD0C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#FF7A6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#9CC8F2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect x="0.5" y="0.5" width="1279" height="835" rx="20" fill="url(#bg)" stroke="#1F2D4B"/>
<g font-family="IBM Plex Sans, Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="40" y="54" font-size="24" fill="#E8EDF7" font-weight="600">How Case Desk is built</text><text x="40" y="80" font-size="14" fill="#A7B3CC">Code decides the facts. Claude writes the words. You approve the money.</text><rect x="240" y="112" width="800" height="700" rx="16" fill="#0A1120" stroke="#2D3E62"/><text x="262" y="142" font-size="15" fill="#E8EDF7" font-weight="600">Case Desk server</text><text x="400" y="142" font-size="11.5" fill="#8592AE" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">FastAPI · casedesk.app.main</text><rect x="252" y="158" width="776" height="150" rx="10" fill="#0E1729"/><rect x="252" y="158" width="3" height="150" rx="1.5" fill="#E8EDF7" opacity=".9"/><text x="268" y="180" font-size="12.5" fill="#E8EDF7" font-weight="600">writes the words</text><text x="391.6" y="180" font-size="12" fill="#8592AE">Claude, from the FactSheet only</text><rect x="252" y="318" width="776" height="182" rx="10" fill="#0B1B26"/><rect x="252" y="318" width="3" height="182" rx="1.5" fill="#3FD0C0" opacity=".9"/><text x="268" y="340" font-size="12.5" fill="#3FD0C0" font-weight="600">decides the facts</text><text x="398.7" y="340" font-size="12" fill="#8592AE">plain code, no LLM</text><rect x="252" y="510" width="776" height="150" rx="10" fill="#17140F"/><rect x="252" y="510" width="3" height="150" rx="1.5" fill="#FFA84C" opacity=".9"/><text x="268" y="532" font-size="12.5" fill="#FFA84C" font-weight="600">approves the money</text><text x="405.8" y="532" font-size="12" fill="#8592AE">you, or a rule you chose</text><rect x="280" y="196" width="190" height="96" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M280 206 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="281" y="197" width="3" height="94" rx="1.5" fill="#8592AE"/><text x="296" y="222" font-size="14" fill="#E8EDF7" font-weight="600">Intent</text><text x="456" y="222" font-size="10.5" fill="#8592AE" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">LLM</text><text x="296" y="243" font-size="12" fill="#A7B3CC">what they ask, in which</text><text x="296" y="260" font-size="12" fill="#A7B3CC">language; flags injection</text><text x="296" y="282" font-size="10.5" fill="#8592AE">keyword rules if the LLM fails</text><rect x="660" y="196" width="200" height="96" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M660 206 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="661" y="197" width="3" height="94" rx="1.5" fill="#8592AE"/><text x="676" y="222" font-size="14" fill="#E8EDF7" font-weight="600">Compose</text><text x="846" y="222" font-size="10.5" fill="#8592AE" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">LLM</text><text x="676" y="243" font-size="12" fill="#A7B3CC">Claude phrases the reply</text><text x="676" y="260" font-size="12" fill="#A7B3CC">from the FactSheet and</text><text x="676" y="277" font-size="12" fill="#A7B3CC">the decided actions</text><rect x="280" y="356" width="190" height="128" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M280 366 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="281" y="357" width="3" height="126" rx="1.5" fill="#3FD0C0"/><text x="296" y="382" font-size="14" fill="#E8EDF7" font-weight="600">Adapty client</text><text x="296" y="403" font-size="12" fill="#A7B3CC">server-side API v2</text><rect x="296" y="412" width="158" height="22" rx="11.0" fill="#101A30" stroke="#2D3E62"/><text x="375.0" y="426.96" font-size="11" fill="#A7B3CC" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">GET profile</text><rect x="296" y="442" width="158" height="22" rx="11.0" fill="#101A30" stroke="#2D3E62"/><text x="375.0" y="456.96" font-size="11" fill="#A7B3CC" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">POST grant access</text><rect x="512" y="356" width="266" height="128" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M512 366 a10 10 0 0 1 10 -10 h246 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="513" y="357" width="3" height="126" rx="1.5" fill="#3FD0C0"/><text x="528" y="382" font-size="14" fill="#E8EDF7" font-weight="600">Engine</text><text x="764" y="382" font-size="10.5" fill="#8592AE" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">engine/</text><rect x="528" y="400" width="74" height="24" rx="12.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="565.0" y="416.14" font-size="11.5" fill="#3FD0C0" text-anchor="middle">13 states</text><path d="M604 412 H 614" fill="none" stroke="#3FD0C0" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#at)"/><rect x="618" y="400" width="76" height="24" rx="12.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="656.0" y="416.14" font-size="11.5" fill="#3FD0C0" text-anchor="middle">FactSheet</text><path d="M696 412 H 706" fill="none" stroke="#3FD0C0" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#at)"/><rect x="710" y="400" width="56" height="24" rx="12.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="738.0" y="416.14" font-size="11.5" fill="#3FD0C0" text-anchor="middle">policy</text><text x="528" y="448" font-size="11" fill="#8592AE" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">state.classify → facts.build →</text><text x="528" y="466" font-size="11" fill="#8592AE" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">policy.decide(state, intent type)</text><rect x="820" y="356" width="196" height="128" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M820 366 a10 10 0 0 1 10 -10 h176 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="821" y="357" width="3" height="126" rx="1.5" fill="#3FD0C0"/><text x="836" y="382" font-size="14" fill="#E8EDF7" font-weight="600">Validator</text><text x="836" y="403" font-size="12" fill="#A7B3CC">blocks any number, date or</text><text x="836" y="420" font-size="12" fill="#A7B3CC">price not in the FactSheet</text><rect x="836" y="436" width="164" height="22" rx="11.0" fill="#2D1A20" stroke="#9A4A42"/><text x="918.0" y="450.96" font-size="11" fill="#FF7A6B" text-anchor="middle">rejected → template</text><rect x="280" y="548" width="190" height="88" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M280 558 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="281" y="549" width="3" height="86" rx="1.5" fill="#FFA84C"/><text x="296" y="574" font-size="14" fill="#E8EDF7" font-weight="600">Approvals</text><text x="296" y="595" font-size="12" fill="#A7B3CC">pending grant requests</text><text x="296" y="612" font-size="12" fill="#A7B3CC">re-checked when approved</text><rect x="512" y="548" width="266" height="88" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M512 558 a10 10 0 0 1 10 -10 h246 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="513" y="549" width="3" height="86" rx="1.5" fill="#FFA84C"/><text x="528" y="574" font-size="14" fill="#E8EDF7" font-weight="600">Rules</text><text x="764" y="574" font-size="10.5" fill="#8592AE" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">rules.py</text><rect x="528" y="592" width="66" height="24" rx="12.0" fill="#2A2117" stroke="#9A6630"/><text x="561.0" y="608.32" font-size="12" fill="#FFA84C" text-anchor="middle">ask</text><rect x="600" y="592" width="98" height="24" rx="12.0" fill="#101A30" stroke="#2D3E62"/><text x="649.0" y="608.32" font-size="12" fill="#A7B3CC" text-anchor="middle">auto ≤ N days</text><rect x="704" y="592" width="60" height="24" rx="12.0" fill="#101A30" stroke="#2D3E62"/><text x="734.0" y="608.32" font-size="12" fill="#A7B3CC" text-anchor="middle">never</text><rect x="820" y="548" width="196" height="88" rx="10" fill="#102238" stroke="#4A6F96" filter="url(#sh)"/><path d="M820 558 a10 10 0 0 1 10 -10 h176 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="821" y="549" width="3" height="86" rx="1.5" fill="#9CC8F2"/><text x="836" y="574" font-size="14" fill="#E8EDF7" font-weight="600">Escalations</text><text x="836" y="594" font-size="12" fill="#9CC8F2">privacy, attacks, “a person”</text><text x="836" y="612" font-size="12" fill="#9CC8F2">always a person (locked)</text><text x="268" y="698" font-size="12.5" fill="#A7B3CC" font-weight="600">beside the pipeline</text><rect x="268" y="712" width="352" height="76" rx="10" fill="#0E1729" stroke="#2D3E62"/><text x="284" y="736" font-size="14" fill="#E8EDF7" font-weight="600">SQLite store</text><text x="604" y="736" font-size="10.5" fill="#8592AE" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">store.py</text><rect x="284" y="752" width="74" height="22" rx="11.0" fill="#101A30" stroke="#2D3E62"/><text x="321.0" y="767.14" font-size="11.5" fill="#A7B3CC" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">cases</text><rect x="366" y="752" width="74" height="22" rx="11.0" fill="#101A30" stroke="#2D3E62"/><text x="403.0" y="767.14" font-size="11.5" fill="#A7B3CC" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">messages</text><rect x="448" y="752" width="74" height="22" rx="11.0" fill="#101A30" stroke="#2D3E62"/><text x="485.0" y="767.14" font-size="11.5" fill="#A7B3CC" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">approvals</text><rect x="530" y="752" width="74" height="22" rx="11.0" fill="#101A30" stroke="#2D3E62"/><text x="567.0" y="767.14" font-size="11.5" fill="#A7B3CC" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">audit</text><rect x="636" y="712" width="380" height="76" rx="10" fill="#0E1729" stroke="#2D3E62"/><text x="652" y="736" font-size="14" fill="#E8EDF7" font-weight="600">Seeder</text><text x="1000" y="736" font-size="10.5" fill="#8592AE" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">seed.py</text><text x="652" y="758" font-size="12" fill="#A7B3CC">16 demo cases through the real engine</text><text x="652" y="776" font-size="12" fill="#A7B3CC">and validator; never calls an LLM</text><rect x="36" y="214" width="152" height="252" rx="26" fill="#05080F" stroke="#24324F" filter="url(#sh)"/><rect x="44" y="222" width="136" height="236" rx="19" fill="#0B1324"/><rect x="60" y="238" width="12" height="12" rx="3" fill="#FFA84C"/><text x="78" y="248.5" font-size="12.5" fill="#E8EDF7" font-weight="600">Lumen Help</text><text x="60" y="276" font-size="11" fill="#8592AE">the app</text><text x="60" y="294" font-size="12" fill="#E8EDF7">help widget</text><rect x="74" y="312" width="98" height="30" rx="9" fill="#1F2E52"/><text x="84" y="331" font-size="11.5" fill="#E8EDF7">I paid but…</text><rect x="54" y="352" width="112" height="40" rx="8" fill="#121D36"/><rect x="54" y="352" width="3" height="40" fill="#FFA84C"/><rect x="66" y="363" width="84" height="5" rx="2.5" fill="#33456B"/><rect x="70" y="376" width="70" height="5" rx="2.5" fill="#33456B"/><text x="54" y="418" font-size="10.5" fill="#8592AE" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">customer_user_id</text><text x="54" y="434" font-size="10.5" fill="#8592AE" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">+ HMAC signature</text><rect x="36" y="548" width="152" height="128" rx="10" fill="#0E1729" stroke="#2D3E62" filter="url(#sh)"/><text x="52" y="574" font-size="15" fill="#E8EDF7" font-weight="600">Adapty</text><text x="52" y="594" font-size="12" fill="#A7B3CC">profiles, access</text><text x="52" y="611" font-size="12" fill="#A7B3CC">levels · API v2</text><rect x="52" y="630" width="120" height="22" rx="11.0" fill="#101A30" stroke="#2D3E62"/><text x="112.0" y="644.96" font-size="11" fill="#A7B3CC" text-anchor="middle">mock in demo</text><rect x="1070" y="356" width="170" height="128" rx="10" fill="#0F2B2F" stroke="#2E8F87" filter="url(#sh)"/><text x="1086" y="382" font-size="14" fill="#E8EDF7" font-weight="600">Reply</text><text x="1086" y="402" font-size="12" fill="#A7B3CC">in the user's language,</text><text x="1086" y="419" font-size="12" fill="#A7B3CC">every fact checked</text><path d="M1088 444 l3.0 3.0 l6.0 -6.5" fill="none" stroke="#3FD0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1104" y="452" font-size="12" fill="#3FD0C0">to the widget</text><rect x="1070" y="548" width="170" height="88" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M1070 558 a10 10 0 0 1 10 -10 h150 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="1071" y="549" width="3" height="86" rx="1.5" fill="#FFA84C"/><text x="1086" y="574" font-size="14" fill="#E8EDF7" font-weight="600">Developer console</text><text x="1086" y="594" font-size="12" fill="#A7B3CC">Night Shift: cases,</text><text x="1086" y="611" font-size="12" fill="#A7B3CC">approvals, rules</text><rect x="1070" y="690" width="170" height="98" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><text x="1086" y="716" font-size="14" fill="#E8EDF7" font-weight="600">MCP server</text><text x="1086" y="736" font-size="12" fill="#A7B3CC">Claude Code / Desktop</text><text x="1086" y="753" font-size="12" fill="#A7B3CC">ask, approve, deny</text><text x="1086" y="772" font-size="11" fill="#FFA84C" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">confirm: true</text><path d="M188 244 H 280" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="214" y="236" font-size="11" fill="#8592AE" text-anchor="middle">message</text><path d="M188 420 H 280" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="214" y="412" font-size="11" fill="#8592AE" text-anchor="middle">signed id</text><path d="M470 420 H 512" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="491" y="412" font-size="11" fill="#8592AE" text-anchor="middle">profile</text><path d="M470 244 H 490 Q 500 244 500 254 V 330 Q 500 340 510 340 H 560 Q 570 340 570 350 V 356" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="506" y="276" font-size="11" fill="#8592AE">intent type</text><path d="M700 356 V 292" fill="none" stroke="#3FD0C0" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#at)"/><text x="708" y="330" font-size="11" fill="#3FD0C0">facts + actions</text><path d="M860 244 H 908 Q 918 244 918 254 V 356" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="926" y="300" font-size="11" fill="#8592AE">draft</text><path d="M1016 420 H 1070" fill="none" stroke="#3FD0C0" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#at)"/><text x="1043" y="412" font-size="11" fill="#3FD0C0" text-anchor="middle">passes</text><path d="M640 484 V 548" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aa)"/><text x="648" y="520" font-size="11" fill="#FFA84C">PROPOSE_GRANT</text><path d="M512 592 H 470" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aa)"/><text x="491" y="584" font-size="11" fill="#FFA84C" text-anchor="middle">ask</text><path d="M1070 600 H 1040 Q 1030 600 1030 610 V 652 Q 1030 662 1020 662 H 385 Q 375 662 375 652 V 636" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aa)"/><text x="700" y="680" font-size="11" fill="#FFA84C" text-anchor="middle">approve / deny</text><path d="M1155 690 V 636" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1163" y="667" font-size="11" fill="#8592AE">console API</text><path d="M280 600 H 188" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aa)"/><text x="214" y="592" font-size="11" fill="#FFA84C" text-anchor="middle">grant</text><path marker-start="url(#ah)" d="M112 548 V 506 Q 112 498 120 498 H 258 Q 266 498 266 490 V 472 Q 266 466 272 466 H 280" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="214" y="490" font-size="11" fill="#8592AE" text-anchor="middle">profile</text></g>
