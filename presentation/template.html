<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Desk — Adapty Hackathon Belgrade 2026 · Team 2</title>
<!--FONTS-->
<!--HEAD-->
<style>
:root{--bg:#0b1324;--ink:#eef2fa;--dim:#9aa7c2;--amb:#ffa84c;--tea:#3fd0c0;--card:rgba(13,22,42,.72);--line:rgba(255,255,255,.12);
--d:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;--b:'IBM Plex Sans',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05080f;color:var(--ink);font-family:var(--b);overflow:hidden}
body:focus{outline:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;z-index:1}
body.onvideo #stage,body.armed #stage{pointer-events:none}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s}
.slide.on{opacity:1;visibility:visible;transition:opacity .5s ease}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 9s linear}
.slide.on .bg{transform:scale(1.0)}
.slide .bg.poster,.slide.on .bg.poster{transform:none;transition:none}
body.vidready .slide.live .bg.poster{visibility:hidden}
.vign.soft{background:linear-gradient(90deg,rgba(11,19,36,.9) 0%,rgba(11,19,36,.78) 42%,rgba(11,19,36,.25) 66%,rgba(11,19,36,0) 80%)}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 45%,rgba(11,19,36,.1),rgba(11,19,36,.7) 80%),linear-gradient(90deg,rgba(11,19,36,.8),rgba(11,19,36,.05) 75%)}
.content{position:absolute;inset:0;padding:130px 150px}
[data-step]{opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease}
[data-step].shown{opacity:1;transform:none}
.kick{font-family:var(--m);font-size:24px;letter-spacing:.18em;color:var(--tea);font-weight:600}
.mega{font-family:var(--d);font-weight:700;font-size:230px;line-height:.95;letter-spacing:-.03em;margin:40px 0 30px}
.mega.sm{font-size:170px}
h2{font-family:var(--d);font-weight:700;font-size:84px;letter-spacing:-.02em;margin:24px 0 60px}
.lead{font-size:54px;line-height:1.25;color:#dfe6f5;max-width:1400px}
.lead em{font-style:normal;color:var(--amb)}
.amb{color:var(--amb)}.tea{color:var(--tea)}
.team{position:absolute;left:150px;bottom:120px;font-family:var(--m);font-size:30px;color:var(--dim)}
.team i{color:var(--amb);font-style:normal;margin:0 .4em}
.team.foot{font-size:24px;bottom:70px}
/* 2:00 AM */
.c-night .clock{font-family:var(--d);font-weight:700;font-size:300px;line-height:1;color:var(--amb);text-shadow:0 0 80px rgba(255,168,76,.35)}
.c-night .clock small{font-size:90px;margin-left:24px;color:#ffcf96}
.review{margin-top:50px;width:1180px;background:rgba(245,247,252,.95);color:#111827;border-radius:28px;padding:34px 44px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.rv-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--m);font-size:22px;color:#6b7280;margin-bottom:14px}
.stars{font-size:34px;color:#f59e0b;letter-spacing:.08em}.stars b{color:#d1d5db;font-weight:400}
.review p{font-size:44px;line-height:1.3;font-weight:600}
.fog{filter:blur(9px);opacity:.55}
.handoff{position:absolute;left:150px;bottom:120px;display:flex;align-items:center;gap:22px}
.pill{font-family:var(--m);font-size:30px;border:2px solid var(--line);border-radius:40px;padding:10px 28px;background:var(--card)}
.arrow{width:220px;height:40px;fill:none;stroke:var(--amb);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.dest{font-family:var(--d);font-size:52px;font-weight:700;color:var(--amb)}
/* who */
.trio{display:flex;align-items:center;gap:26px}
.card{width:470px;min-height:400px;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:44px 42px;backdrop-filter:blur(6px)}
.card .ic{width:84px;height:84px;color:var(--amb);margin-bottom:26px}.card.teal .ic{color:var(--tea)}
.card .ic svg{width:100%;height:100%}
.card h3{font-family:var(--d);font-size:50px;margin-bottom:18px}
.card p{font-size:40px;line-height:1.3;color:#d6deee}
.link{width:80px;height:40px;fill:none;stroke:var(--dim);stroke-width:4;stroke-linecap:round}
/* bet */

.blk{font-family:var(--d);font-size:96px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:0;padding:22px 44px;border-left:10px solid;background:linear-gradient(90deg,rgba(13,22,42,.85),rgba(13,22,42,0));border-radius:6px}

.qa{position:absolute;right:150px;bottom:150px;font-family:var(--d);font-size:110px;font-weight:700;color:var(--amb)}
/* intro */
.hook{font-family:var(--d);font-weight:600;font-size:66px;line-height:1.18;letter-spacing:-.01em;max-width:1300px;margin-top:10px}
blockquote.brief{font-family:var(--d);font-weight:600;font-size:64px;line-height:1.2;letter-spacing:-.01em;max-width:1250px;margin:46px 0 0;color:#e8edf7}
blockquote.brief b{color:var(--amb)}
.reading{font-size:44px;line-height:1.3;margin-top:56px;max-width:1150px;padding-left:28px;border-left:6px solid var(--tea)}
.fork{display:flex;align-items:center;gap:34px;margin-top:64px}
.fk.q{font-size:32px;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 30px;max-width:300px;line-height:1.25}
.fk-arms{display:flex;flex-direction:column;gap:22px}
.arm{display:flex;align-items:center;gap:20px;font-size:32px}
.arm span{color:#d6deee}.arm i{font-style:normal;color:var(--dim)}
.arm b{font-family:var(--d);font-size:38px;padding:10px 24px;border-radius:16px}
.arm.bad b{color:#ff8a7a;background:rgba(255,122,107,.12);border:2px solid rgba(255,122,107,.45)}
.arm.good b{color:var(--tea);background:rgba(63,208,192,.12);border:2px solid rgba(63,208,192,.5)}
.lumen{font-size:44px;margin-top:30px}.lumen b{font-family:var(--d);color:var(--amb)}
.views{display:flex;gap:44px;align-items:flex-end;margin-top:44px}
.vw{margin:0;display:flex;flex-direction:column;gap:16px}
.vw img{display:block;border-radius:22px;border:2px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.vw.phone img{height:440px;width:auto}.vw.cons img{height:440px;width:auto;max-width:820px;object-fit:cover}
.vw figcaption b{font-family:var(--d);font-size:36px;display:block}.vw figcaption span{font-size:26px;color:var(--dim)}
.who{position:absolute;left:150px;bottom:110px;display:flex;align-items:center;gap:18px}
.who .lbl{font-family:var(--m);font-size:22px;letter-spacing:.14em;color:var(--tea);text-transform:uppercase;margin-right:10px}
.person{font-family:var(--d);font-size:40px;font-weight:600;background:var(--card);border:2px solid rgba(255,168,76,.45);border-radius:40px;padding:10px 30px}
.person small{font-family:var(--b);font-weight:400;font-size:24px;color:var(--dim);margin-left:8px}
/* why */
.why{display:flex;flex-direction:column;gap:34px;max-width:1250px}
.wrow{display:flex;gap:34px;align-items:flex-start}
.wn{font-family:var(--d);font-weight:700;font-size:64px;color:var(--tea);min-width:130px;line-height:1}
.wrow.dead .wn{color:#ff7a6b}.wrow.win .wn{color:var(--amb)}
.wrow p{font-size:40px;line-height:1.3}
.wrow s{text-decoration-thickness:4px;text-decoration-color:#ff7a6b;color:#c9d3e6}
.wrow small{font-size:28px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}
.chips span{font-size:28px;border:2px solid rgba(255,168,76,.5);border-radius:40px;padding:8px 22px;background:rgba(11,19,36,.7)}
/* hood */
.arch{position:absolute;left:150px;right:150px;top:210px;bottom:110px}
.node{position:absolute;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:26px 30px;backdrop-filter:blur(4px)}
.node b{font-family:var(--d);font-size:44px;display:block}.node small{font-size:26px;color:var(--dim)}
.node.app{left:0;top:90px;width:300px}
.node.core{left:400px;top:40px;width:700px;border-color:rgba(63,208,192,.6)}
.node.adapty{left:1220px;top:60px;width:400px;border-color:rgba(255,168,76,.6)}
.node.adapty code{display:block;font-family:var(--m);font-size:20px;color:#ffd7a8;margin-top:10px}
.node.console{left:400px;top:440px;width:700px}
.pipe2{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}
.pipe2 span{font-family:var(--m);font-size:24px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:rgba(5,8,15,.5)}
.pipe2 i{font-style:normal;color:var(--dim);font-size:24px}
.edge{position:absolute;height:4px;background:var(--dim)}
.edge span{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--m);font-size:19px;line-height:1.25;color:var(--dim)}
.edge.e1{left:300px;width:100px;top:160px}.edge span{font-size:17px}
.edge.e2{left:1100px;width:120px;top:160px}
.foot2{position:absolute;left:0;bottom:0;font-family:var(--m);font-size:24px;color:var(--dim)}
/* real */
.cols{display:flex;gap:40px;margin-top:60px}
.col{flex:1;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:40px 46px}
.col h3{font-family:var(--d);font-size:60px;margin-bottom:20px}
.col ul{list-style:none}.col li{font-size:36px;line-height:1.3;margin:16px 0;padding-left:34px;position:relative}
.col li::before{content:"";position:absolute;left:0;top:.5em;width:14px;height:14px;border-radius:50%;background:currentColor;opacity:.5}
.col code{font-family:var(--m);color:var(--amb)}
/* next */
ul.next{list-style:none;margin-top:50px}
ul.next li{font-family:var(--d);font-size:54px;font-weight:600;margin:20px 0;padding-left:56px;position:relative}
ul.next li::before{content:"→";position:absolute;left:0;color:var(--amb)}
ul.next small{font-size:32px;color:var(--dim);font-weight:400}
/* video slide: full window, not scaled */
#vid{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#000;z-index:0}
/* Subin, 2026-11-07: the opening background (the video's frame 0) is blurred behind the slides; when the video starts it pulls into focus */
#vid{filter:blur(14px) brightness(.85);transform:scale(1.06);transition:filter 1.4s ease,transform 1.4s ease}
body.onvideo #vid{filter:none;transform:none}
.slide.live .bg.poster{filter:blur(14px) brightness(.85);transform:scale(1.06)!important}
body.offvid #vid{visibility:hidden}
#vhint{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:30;background:rgba(11,19,36,.88);border:1px solid var(--line);color:var(--ink);font-family:var(--m);font-size:15px;padding:10px 18px;border-radius:24px;display:none;white-space:nowrap}
#vhint b{color:var(--amb);font-weight:600}
body.onvideo.deckkeys #vhint{display:block}
/* notes / presenter */
#notes{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(5,8,15,.94);border-top:2px solid var(--amb);padding:16px 26px 20px;display:none;font-size:20px;line-height:1.45;max-height:42vh;overflow:auto}
body.shownotes #notes{display:block}
#notes .bar{display:flex;gap:26px;font-family:var(--m);font-size:15px;color:var(--dim);margin-bottom:8px}
#notes .bar b{color:var(--amb);font-weight:600}
#notes .tx{white-space:pre-wrap;color:#f3f6fc}
#notes .tx i{color:var(--tea);font-style:normal}
#fsb{position:fixed;right:18px;top:16px;z-index:50;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(11,19,36,.82);color:var(--ink);font-size:24px;line-height:44px;text-align:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
#fsb.vis{opacity:1;pointer-events:auto}#fsb:hover{border-color:var(--amb);color:var(--amb)}
#prog{position:fixed;left:0;bottom:0;height:3px;background:var(--amb);z-index:20;transition:width .3s}
body.onvideo #prog{display:none}
</style>
</head>
<body tabindex="-1">
<!--VIDEO-->
<div id="stage">
<!--SLIDES-->
</div>
<div id="vhint">Video: <b>Space</b> play/pause · <b>Esc</b> back to slides · <b>→</b> next slide · <b>←</b> previous</div>
<div id="notes"><div class="bar"><span id="nslide"></span><span>total <b id="ntot">0:00</b></span><span>this slide <b id="nsl">0:00</b> / <span id="ntarget"></span></span><span>next: <span id="nnext"></span></span><span>N hide · T reset timer · P presenter window</span></div><div class="tx" id="ntx"></div></div>
<div id="prog"></div>
<button id="fsb" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
<script>
const META=/*META*/[];
const S=[...document.querySelectorAll('#stage .slide')];
const stage=document.getElementById('stage'),vid=document.getElementById('vid');
if(vid)document.body.appendChild(vid);  // out of the scaled stage: position:fixed must be relative to the window
let cur=0,step=0,t0=null,ts=Date.now(),pres=null,vidState='idle';
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${k})`;stage.style.left='50%';stage.style.top='50%';stage.style.transformOrigin='center center'}
addEventListener('resize',fit);fit();
const maxSteps=i=>+S[i].dataset.steps||0;
const isVideo=i=>S[i]&&S[i].classList.contains('video');
function render(){
  S.forEach((s,i)=>s.classList.toggle('on',i===cur));
  S[cur].querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('shown',+e.dataset.step<=step));
  document.body.classList.toggle('onvideo',isVideo(cur));
  document.body.classList.toggle('offvid',!isVideo(cur)&&!S[cur].classList.contains('live'));
  document.getElementById('prog').style.width=(100*(cur+1)/S.length)+'%';
  const arm=!isVideo(cur)&&isVideo(cur+1)&&step>=maxSteps(cur)&&document.body.classList.contains('vidready');
  document.body.classList.toggle('armed',arm);
  if(arm){send('arm');setTimeout(()=>{try{vid.focus();vid.contentWindow.focus()}catch(e){}},30)}
  else{send('disarm');if(!isVideo(cur))deckKeys(true)}
  updNotes();
}
function go(i,st,started){
  i=Math.max(0,Math.min(S.length-1,i));
  if(i!==cur){if(isVideo(cur))send(i<cur&&S[i].classList.contains('live')?'bg':'pause');ts=Date.now()}
  const into=i!==cur&&isVideo(i);
  if(t0===null&&(i>0||st>0))t0=Date.now();
  cur=i;step=st;render();
  if(into&&!started){send('play');vidState='starting'}   // the advance key itself starts it: frame 0 is what the slide was showing
  if(isVideo(cur))enterVideo();
}
function next(){if(step<maxSteps(cur))step++,render();else if(cur<S.length-1)go(cur+1,0)}
function prev(){if(step>0)step--,render();else if(cur>0)go(cur-1,maxSteps(cur-1))}
/* ---- video ---- */
let vloaded=false;
async function loadVideo(){
  if(vloaded||!vid)return;vloaded=true;
  if(vid.dataset.src){vid.src=vid.dataset.src;return}
  // artifact build: page is packed; asset: audio resolved by the console on the hidden <audio class=vxa> here
  const b=Uint8Array.from(atob(document.getElementById('vxsrc').textContent),c=>c.charCodeAt(0));
  let txt=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  // The child is its own opaque origin: blob: URLs from here don't load there. So it gets a copy of the console's
  // boot script and this page plays the console's part: it answers {bagley:'asset'} with the Blob itself.
  const boot=[...document.scripts].find(x=>x.textContent.includes('__bagleyBlob=function'));
  if(boot)txt=txt.replace('<head>','<head><script>'+boot.textContent+'<\/script>');
  window.__vxBoot=!!boot;
  vid.srcdoc=txt;
}
function send(m){try{vid&&vid.contentWindow&&vid.contentWindow.postMessage({casedeck:m},'*')}catch(e){}}
function deckKeys(on){document.body.classList.toggle('deckkeys',on);if(on){try{vid&&vid.blur()}catch(e){}window.focus();document.body.focus()}}
function enterVideo(){setTimeout(()=>{try{vid.focus();vid.contentWindow.focus()}catch(e){}deckKeys(false)},60)}
addEventListener('message',e=>{const q=e.data;
  if(q&&q.bagley==='asset'&&vid&&e.source===vid.contentWindow){const el=[...document.querySelectorAll('audio.vxa')].find(a=>a.getAttribute('data-asset')===q.name||a.getAttribute('src')==='asset:'+q.name);
    const answer=(n)=>{const bl=el&&(el.src||'').startsWith('blob:')&&window.__bagleyBlob&&window.__bagleyBlob(el.src);
      if(bl)vid.contentWindow.postMessage({bagley:'asset-result',name:q.name,blob:bl},'*');else if(n>0)setTimeout(()=>answer(n-1),250);
      else vid.contentWindow.postMessage({bagley:'asset-result',name:q.name,error:'missing'},'*')};answer(60);return}
  const d=q&&q.casedeck;if(!d)return;
  if(d==='fs'){toggleFS();return}
  if(d==='move'){showFsb();return}
  if(d==='ready'){document.body.classList.add('vidready');render()}
  if(d.key){onKey({key:d.key,preventDefault(){}});return}
  if(d==='advance'){vidState='playing';if(!isVideo(cur))go(cur+1,0,true);return}
  if(d==='playing'||d==='paused'||d==='ready')vidState=d;
  if(!isVideo(cur))return;
  if(d==='back'){send('pause');deckKeys(true)}
  else if(d==='ended'){vidState='ended';deckKeys(true)}
  else if(d==='next'){deckKeys(true);next()}});
addEventListener('blur',()=>{if(isVideo(cur))setTimeout(()=>{if(document.activeElement===vid)document.body.classList.remove('deckkeys')},0)});
addEventListener('focus',()=>{if(isVideo(cur))document.body.classList.add('deckkeys')});
/* ---- keys ---- */
function onKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(isVideo(cur)&&(k===' '||k==='Enter'||k==='k')){e.preventDefault();enterVideo();send('play');return}
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')go(0,0);else if(k==='End')go(S.length-1,maxSteps(S.length-1));
  else if(k==='n'||k==='N')document.body.classList.toggle('shownotes'),updNotes();
  else if(k==='t'||k==='T'){t0=Date.now();ts=Date.now();updNotes()}
  else if(k==='p'||k==='P')openPresenter();
  else if(k==='f'||k==='F')toggleFS();
}
document.addEventListener('keydown',onKey);
/* real fullscreen: always the whole deck document (the video iframe inside it fills the screen too) */
function toggleFS(){const d=document;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
  else{const r=d.documentElement,f=r.requestFullscreen||r.webkitRequestFullscreen;const p=f&&f.call(r,{navigationUI:'hide'});p&&p.catch&&p.catch(()=>{})}}catch(_){}}
const fsb=document.getElementById('fsb');let fsT=0;
function showFsb(){fsb.textContent=document.fullscreenElement?'✕':'⛶';fsb.title=document.fullscreenElement?'Exit fullscreen (F / Esc)':'Fullscreen (F)';fsb.classList.add('vis');clearTimeout(fsT);fsT=setTimeout(()=>fsb.classList.remove('vis'),2500)}
fsb.addEventListener('click',e=>{e.stopPropagation();toggleFS();showFsb();if(isVideo(cur))enterVideo()});
addEventListener('pointermove',showFsb,{passive:true});
document.addEventListener('fullscreenchange',()=>{fit();showFsb();if(isVideo(cur))setTimeout(()=>{try{vid.focus()}catch(e){}},50)});
showFsb();
stage.addEventListener('click',e=>{if(!isVideo(cur))next()});
/* ---- notes + timer ---- */
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\[([^\]]*)\]/g,'<i>[$1]</i>');
function notesHTML(){const m=META[cur],nx=META[cur+1];
  return {slide:`slide ${cur+1}/${S.length} · step ${step}/${maxSteps(cur)}`,tot:t0?fmt(Date.now()-t0):'0:00',sl:fmt(Date.now()-ts),
    target:m.secs?('≈'+m.secs+' s'):'video ≈3:04',next:nx?nx.id:'—',tx:esc(m.notes)}}
function updNotes(){const n=notesHTML();
  if(document.body.classList.contains('shownotes')){
    nslide.textContent=n.slide;ntot.textContent=n.tot;nsl.textContent=n.sl;ntarget.textContent=n.target;nnext.textContent=n.next;ntx.innerHTML=n.tx}
  if(pres&&!pres.closed){const d=pres.document;const set=(id,v,h)=>{const el=d.getElementById(id);if(el)h?el.innerHTML=v:el.textContent=v};
    set('ps',n.slide);set('pt',n.tot);set('pl',n.sl+' / '+n.target);set('pn','next: '+n.next);set('px',n.tx,1)}}
setInterval(updNotes,500);
function openPresenter(){
  pres=window.open('','casedesk-presenter','width=1000,height=640');
  if(!pres)return;
  pres.document.open();pres.document.write(`<!doctype html><title>Presenter — Case Desk</title><body style="margin:0;background:#0b1324;color:#eef2fa;font:22px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding:24px">
  <div style="font:16px 'IBM Plex Mono',monospace;color:#9aa7c2;display:flex;gap:28px"><span id=ps></span><span>total <b id=pt style="color:#ffa84c;font-size:28px"></b></span><span>slide <b id=pl style="color:#ffa84c"></b></span><span id=pn></span></div>
  <div id=px style="white-space:pre-wrap;margin-top:18px;font-size:30px"></div>
  <p style="font:14px monospace;color:#9aa7c2;margin-top:30px">Keys here drive the deck: → ← Space PageUp/PageDown · T reset timer</p></body>`);
  pres.document.close();
  pres.document.addEventListener('keydown',e=>{if(e.key==='n'||e.key==='N'||e.key==='p'||e.key==='P')return;onKey(e)});
  updNotes();
}
render();document.body.focus();loadVideo();
window.__deck={go,next,prev,state:()=>({cur,step,id:META[cur].id,vidState,deckKeys:document.body.classList.contains('deckkeys'),active:document.activeElement&&document.activeElement.id})};
</script>
</body>
</html>
