<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">The money path</title>
<desc id="d">Policy can only propose a grant. Your rule decides what happens: ask makes a pending request you approve in the console or over MCP with confirm; auto approves at once only within code limits (paid, not refunded, at most N days, once per 90 days) and otherwise falls back to a pending request; never drops the proposal. Every approval takes the same path: Adapty re-read, policy re-check, Adapty grant. Escalations always go to a person.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1324"/><stop offset="1" stop-color="#080D19"/></linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#8592AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#FFA84C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#3FD0C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#FF7A6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#9CC8F2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect x="0.5" y="0.5" width="1279" height="719" rx="20" fill="url(#bg)" stroke="#1F2D4B"/>
<g font-family="IBM Plex Sans, Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="40" y="54" font-size="24" fill="#E8EDF7" font-weight="600">The money path</text><text x="40" y="80" font-size="14" fill="#A7B3CC">Code can only propose a grant. Your rule decides what happens next, and every yes takes the same path.</text><rect x="40" y="303" width="196" height="110" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M40 313 a10 10 0 0 1 10 -10 h176 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="41" y="304" width="3" height="108" rx="1.5" fill="#FFA84C"/><text x="56" y="329" font-size="13" fill="#FFA84C" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">PROPOSE_GRANT</text><text x="56" y="353" font-size="12" fill="#A7B3CC">policy proposes it only for a</text><text x="56" y="370" font-size="12" fill="#A7B3CC">paid user, billing error</text><text x="56" y="387" font-size="12" fill="#A7B3CC">≤ 14 days, once per 90 days</text><path d="M318 308 L368 358 L318 408 L268 358 Z" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><text x="318" y="355" font-size="12.5" fill="#A7B3CC" text-anchor="middle">your</text><text x="318" y="372" font-size="14" fill="#E8EDF7" font-weight="600" text-anchor="middle">rule</text><path d="M236 358 H 266" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M318 308 V 210 Q 318 200 328 200 H 420" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aa)"/><rect x="344" y="186" width="50" height="24" rx="12.0" fill="#2A2117" stroke="#9A6630"/><text x="369.0" y="202.32" font-size="12" fill="#FFA84C" text-anchor="middle">ask</text><path d="M368 358 H 420" fill="none" stroke="#3FD0C0" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#at)"/><rect x="372" y="326" width="44" height="22" rx="11.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="394.0" y="341.14" font-size="11.5" fill="#3FD0C0" text-anchor="middle">auto</text><path d="M318 408 V 510 Q 318 520 328 520 H 420" fill="none" stroke="#8592AE" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="344" y="506" width="62" height="24" rx="12.0" fill="#101A30" stroke="#2D3E62"/><text x="375.0" y="522.32" font-size="12" fill="#A7B3CC" text-anchor="middle">never</text><rect x="420" y="152" width="226" height="96" rx="10" fill="#2A2117" stroke="#9A6630" filter="url(#sh)"/><text x="436" y="178" font-size="14" fill="#E8EDF7" font-weight="600">Pending request</text><text x="436" y="199" font-size="12" fill="#A7B3CC">the reply says it was asked</text><text x="436" y="216" font-size="12" fill="#A7B3CC">for, never that it is given</text><text x="436" y="236" font-size="10.5" fill="#8592AE" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">approvals table</text><path d="M646 200 H 690" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aa)"/><rect x="690" y="140" width="222" height="120" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M690 150 a10 10 0 0 1 10 -10 h202 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="691" y="141" width="3" height="118" rx="1.5" fill="#FFA84C"/><text x="706" y="166" font-size="14" fill="#E8EDF7" font-weight="600">You approve</text><rect x="706" y="180" width="190" height="30" rx="6" fill="#FFA84C"/><text x="801" y="200" font-size="12" fill="#1F1200" font-weight="600" text-anchor="middle">Give Ava 3 days of premium</text><text x="706" y="230" font-size="11" fill="#A7B3CC" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">or over MCP: approve_grant</text><text x="706" y="247" font-size="11" fill="#FFA84C" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">with confirm: true</text><rect x="420" y="300" width="492" height="116" rx="10" fill="#0B1B26" stroke="#2E8F87" filter="url(#sh)"/><text x="436" y="326" font-size="14" fill="#E8EDF7" font-weight="600">Automatic, only inside limits the code enforces</text><rect x="436" y="340" width="58" height="24" rx="12.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="465.0" y="356.32" font-size="12" fill="#3FD0C0" text-anchor="middle"></text><path d="M447 351 l2.55 2.55 l5.1 -5.5249999999999995" fill="none" stroke="#3FD0C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="356.5" font-size="12" fill="#3FD0C0">paid</text><rect x="502" y="340" width="112" height="24" rx="12.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="558.0" y="356.32" font-size="12" fill="#3FD0C0" text-anchor="middle"></text><path d="M513 351 l2.55 2.55 l5.1 -5.5249999999999995" fill="none" stroke="#3FD0C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="529" y="356.5" font-size="12" fill="#3FD0C0">not refunded</text><rect x="622" y="340" width="126" height="24" rx="12.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="685.0" y="356.32" font-size="12" fill="#3FD0C0" text-anchor="middle"></text><path d="M633 351 l2.55 2.55 l5.1 -5.5249999999999995" fill="none" stroke="#3FD0C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="649" y="356.5" font-size="12" fill="#3FD0C0">≤ N days (1–7)</text><rect x="756" y="340" width="138" height="24" rx="12.0" fill="#0F2B2F" stroke="#2E8F87"/><text x="825.0" y="356.32" font-size="12" fill="#3FD0C0" text-anchor="middle"></text><path d="M767 351 l2.55 2.55 l5.1 -5.5249999999999995" fill="none" stroke="#3FD0C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="783" y="356.5" font-size="12" fill="#3FD0C0">once per 90 days</text><text x="436" y="392" font-size="12" fill="#A7B3CC">recorded as approved by “rule: auto up to N days”</text><text x="436" y="408" font-size="12" fill="#A7B3CC">and shown in teal: “Given automatically by your rule”</text><path d="M560 300 V 248" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" marker-end="url(#aa)"/><text x="568" y="280" font-size="11" fill="#FFA84C">anything outside the limits,</text><text x="568" y="294" font-size="11" fill="#FFA84C">or a failure → pending request</text><rect x="420" y="478" width="492" height="84" rx="10" fill="#0E1729" stroke="#2D3E62" stroke-dasharray="4 4"/><text x="436" y="504" font-size="14" fill="#E8EDF7" font-weight="600">Dropped</text><text x="436" y="525" font-size="12" fill="#A7B3CC">before the reply is written, so the reply never</text><text x="436" y="542" font-size="12" fill="#A7B3CC">mentions it. Nothing reaches Adapty.</text><rect x="960" y="140" width="280" height="312" rx="10" fill="#101A30" stroke="#2D3E62" filter="url(#sh)"/><path d="M960 150 a10 10 0 0 1 10 -10 h260 a10 10 0 0 1 10 10 v-7 " fill="none"/><rect x="961" y="141" width="3" height="310" rx="1.5" fill="#FFA84C"/><text x="978" y="168" font-size="14" fill="#E8EDF7" font-weight="600">The one approve path</text><text x="978" y="186" font-size="11.5" fill="#8592AE">console, MCP and rule all use it</text><circle cx="990" cy="222" r="10" fill="#FFA84C"/><text x="990" y="226" font-size="11.5" fill="#1F1200" font-weight="600" text-anchor="middle">1</text><text x="1010" y="226" font-size="13" fill="#E8EDF7" font-weight="600">Re-read the Adapty profile</text><text x="1010" y="244" font-size="11.5" fill="#8592AE">fresh state, not the old one</text><line x1="990" y1="234" x2="990" y2="272" stroke="#9A6630"/><circle cx="990" cy="284" r="10" fill="#FFA84C"/><text x="990" y="288" font-size="11.5" fill="#1F1200" font-weight="600" text-anchor="middle">2</text><text x="1010" y="288" font-size="13" fill="#E8EDF7" font-weight="600">Re-check the policy</text><text x="1010" y="306" font-size="11.5" fill="#8592AE">state changed? window closed?</text><line x1="990" y1="296" x2="990" y2="334" stroke="#9A6630"/><circle cx="990" cy="346" r="10" fill="#FFA84C"/><text x="990" y="350" font-size="11.5" fill="#1F1200" font-weight="600" text-anchor="middle">3</text><text x="1010" y="350" font-size="13" fill="#E8EDF7" font-weight="600">Grant through Adapty</text><text x="1010" y="368" font-size="11.5" fill="#8592AE" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">POST grant access level</text><line x1="978" y1="398" x2="1222" y2="398" stroke="#2D3E62"/><text x="978" y="420" font-size="11.5" fill="#FF7A6B">not eligible any more → stays pending</text><text x="978" y="437" font-size="11.5" fill="#FF7A6B">Adapty error → failed, retry</text><path d="M912 200 H 960" fill="none" stroke="#FFA84C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aa)"/><path d="M912 358 H 936 Q 946 358 946 348 V 300 Q 946 290 956 290 H 960" fill="none" stroke="#3FD0C0" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#at)"/><ellipse cx="1100" cy="530" rx="150" ry="44" fill="#3FD0C0" opacity=".16" filter="url(#glow)"/><rect x="960" y="492" width="280" height="76" rx="10" fill="#0F2B2F" stroke="#3FD0C0" filter="url(#sh)"/><circle cx="994" cy="530" r="15" fill="none" stroke="#3FD0C0" stroke-width="1.6"/><path d="M987 530.5 l3.4499999999999997 3.4499999999999997 l6.8999999999999995 -7.475" fill="none" stroke="#3FD0C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1020" y="525" font-size="15" fill="#E8EDF7" font-weight="600">Premium given until 7 Nov</text><text x="1020" y="545" font-size="12" fill="#3FD0C0">status card and reply say so</text><path d="M1100 452 V 492" fill="none" stroke="#3FD0C0" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#at)"/><rect x="40" y="612" width="1200" height="64" rx="12" fill="#102238" stroke="#4A6F96"/><rect x="57" y="641" width="18" height="14" rx="3" fill="none" stroke="#9CC8F2" stroke-width="1.6"/><path d="M61 641 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#9CC8F2" stroke-width="1.6"/><text x="90" y="650" font-size="14" fill="#9CC8F2" font-weight="600">Escalations always go to a person.</text><text x="330" y="650" font-size="13" fill="#A7B3CC">Privacy requests, attacks and “I want a person” are locked: no rule can automate them.</text></g>
</svg>
